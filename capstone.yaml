run: uvicorn app.main:app --reload
seed: python -m app.seed
test: pytest -v
base_url: http://localhost:8000

endpoints:
  - /health
  - /health/db
  - /api/v1/auth/me
  - /api/v1/tenant/me
  - /api/v1/widgets
  - /api/v1/public/widgets/{public_id}
  - /api/v1/public/widgets/{public_id}/submissions
  - /api/v1/dashboard/widgets
  - /api/v1/dashboard/widgets/{widget_id}/submissions
  - /api/v1/dashboard/widgets/{widget_id}/stats
  - /widget/v1/widget.js
  - /api/inngest

demo:
  command: python -m http.server 5500 --directory demo
  url: http://127.0.0.1:5500

database:
  start: docker compose up -d db
  migrate: alembic upgrade head

background_jobs:
  service: Inngest
  local_command: npx inngest-cli@latest dev