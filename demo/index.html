<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>FlyRank Widget Demo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .hero {
            margin-bottom: 40px;
        }

        .hero h1 {
            margin: 0 0 12px;
            font-size: 42px;
        }

        .hero p {
            color: #666;
            font-size: 18px;
        }

        .widget-section {
            padding: 32px;
            background: white;
            border-radius: 16px;
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="hero">
            <h1>Customer Website</h1>
            <p>
                This page is running on a different origin from
                the FlyRank API.
            </p>
        </section>

        <section class="widget-section">
            <div id="flyrank-widget"></div>

            <script
                src="http://127.0.0.1:8000/widget/v1/widget.js"
                data-widget="32915311-aa8e-4e3f-b13e-a43996e1de33"
                data-container="flyrank-widget"
            ></script>
        </section>
    </main>
</body>
</html>
